<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentsHub — 演示</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   DESIGN SYSTEM — Morandi Palette / Royal Blue
   Tokens sourced from apps/desktop/src/renderer/styles/globals.css
   ═══════════════════════════════════════════════════════════════ */
:root {
  --theme-hue: 220;
  --theme-sat: 70;
  --radius: 0.75rem;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", "Fira Code", "JetBrains Mono", Menlo, Consolas, monospace;
}

/* Light mode */
:root, html:not(.dark) {
  --bg: hsl(220 14% 96%);
  --fg: hsl(220 20% 25%);
  --card: hsl(0 0% 100%);
  --card-fg: hsl(220 20% 25%);
  --popover: hsl(0 0% 100%);
  --secondary: hsl(220 14% 96%);
  --secondary-fg: hsl(220 20% 25%);
  --muted: hsl(220 14% 94%);
  --muted-fg: hsl(220 12% 50%);
  --accent: hsl(220 35% 94%);
  --accent-fg: hsl(220 70% 40%);
  --destructive: hsl(0 45% 55%);
  --border: hsl(220 13% 90%);
  --input: hsl(220 13% 90%);
  --sidebar: hsl(0 0% 100%);
  --sidebar-accent: hsl(220 14% 95%);
  --sidebar-border: hsl(220 13% 90%);
  --rail-bg: hsl(220 16% 97%);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 4px 12px rgba(0,0,0,.06);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.08);
}

/* Dark mode */
html.dark {
  --bg: hsl(220 25% 7%);
  --fg: hsl(220 15% 92%);
  --card: hsl(220 22% 10%);
  --card-fg: hsl(220 15% 92%);
  --popover: hsl(220 22% 12%);
  --secondary: hsl(220 20% 12%);
  --secondary-fg: hsl(220 15% 92%);
  --muted: hsl(220 20% 12%);
  --muted-fg: hsl(220 12% 60%);
  --accent: hsl(220 20% 15%);
  --accent-fg: hsl(220 70% 85%);
  --destructive: hsl(0 70% 55%);
  --border: hsl(220 20% 14%);
  --input: hsl(220 20% 14%);
  --sidebar: hsl(220 25% 7%);
  --sidebar-accent: hsl(220 20% 14%);
  --sidebar-border: hsl(220 20% 12%);
  --rail-bg: hsl(220 26% 5%);
  --shadow-sm: 0 2px 4px rgba(0,0,0,.4);
  --shadow: 0 8px 16px rgba(0,0,0,.5);
  --shadow-lg: 0 16px 48px rgba(0,0,0,.6);
}

/* Primary (derived from theme-hue/sat at L=55%) */
:root, html.dark {
  --primary: hsl(var(--theme-hue) var(--theme-sat) 55%);
  --primary-fg: hsl(0 0% 100%);
  --ring: hsl(var(--theme-hue) var(--theme-sat) 55%);
}

/* ═══════════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background 0.2s, color 0.2s;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; }
svg { display: block; flex-shrink: 0; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted-fg); }

/* ═══════════════════════════════════════════════════════════════
   ICONS
   ═══════════════════════════════════════════════════════════════ */
.ico { width: 18px; height: 18px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 15px; height: 15px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ico-lg { width: 22px; height: 22px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ico-xl { width: 28px; height: 28px; stroke-width: 1.8; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ═══════════════════════════════════════════════════════════════
   APP LAYOUT
   ═══════════════════════════════════════════════════════════════ */
.app-shell { display: flex; flex-direction: column; height: 100vh; }

/* Title bar */
.titlebar {
  display: flex; align-items: center; gap: 12px;
  height: 40px; padding: 0 12px;
  background: var(--sidebar);
  border-bottom: 1px solid var(--sidebar-border);
  user-select: none;
  flex-shrink: 0;
}
.titlebar-dots { display: flex; gap: 8px; margin-right: 8px; }
.tdot { width: 12px; height: 12px; border-radius: 50%; }
.tdot-r { background: #ff5f57; }
.tdot-y { background: #febc2e; }
.tdot-g { background: #28c840; }
.titlebar-title { font-size: 13px; font-weight: 600; color: var(--muted-fg); flex: 1; text-align: center; }
.titlebar-actions { display: flex; align-items: center; gap: 4px; }

/* Body area */
.app-body { display: flex; flex: 1; overflow: hidden; }

/* Icon rail */
.icon-rail {
  width: 56px;
  background: var(--rail-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex; flex-direction: column;
  align-items: center;
  padding: 8px 0;
  gap: 4px;
  flex-shrink: 0;
}
.rail-btn {
  width: 40px; height: 40px;
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted-fg);
  transition: all 0.15s;
  position: relative;
}
.rail-btn:hover { background: var(--sidebar-accent); color: var(--fg); }
.rail-btn.active { background: var(--primary); color: var(--primary-fg); }
.rail-btn.active::after {
  content: ''; position: absolute; right: -8px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; border-radius: 2px; background: var(--primary);
}
.rail-sep { width: 24px; height: 1px; background: var(--sidebar-border); margin: 4px 0; }
.rail-spacer { flex: 1; }

/* Nav panel */
.nav-panel {
  width: 220px;
  background: var(--sidebar);
  border-right: 1px solid var(--sidebar-border);
  display: flex; flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}
.nav-panel-header { padding: 16px 16px 8px; }
.nav-panel-title { font-size: 16px; font-weight: 700; }
.nav-panel-sub { font-size: 12px; color: var(--muted-fg); margin-top: 2px; }
.nav-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: var(--radius);
  font-size: 13px; color: var(--fg);
  cursor: pointer; transition: background 0.12s;
  width: 100%; text-align: left;
}
.nav-item:hover { background: var(--sidebar-accent); }
.nav-item.active { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.nav-item .ico-sm { color: var(--muted-fg); flex-shrink: 0; }
.nav-item.active .ico-sm { color: var(--accent-fg); }
.nav-item-count { margin-left: auto; font-size: 11px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.nav-item.active .nav-item-count { color: var(--accent-fg); }
.nav-section { font-size: 11px; font-weight: 600; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 10px 4px; }

/* Folder tree */
.folder-tree { padding-left: 0; }
.folder-row {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-radius: calc(var(--radius) - 4px);
  font-size: 13px; cursor: pointer; transition: background 0.12s;
}
.folder-row:hover { background: var(--sidebar-accent); }
.folder-row .folder-chevron { width: 14px; height: 14px; transition: transform 0.15s; opacity: 0.6; }
.folder-row.expanded .folder-chevron { transform: rotate(90deg); }
.folder-row .folder-icon { color: hsl(45 80% 55%); }
.folder-row.private .folder-icon { color: var(--muted-fg); }
.folder-children { padding-left: 16px; overflow: hidden; }
.folder-children.collapsed { display: none; }

/* Tag cloud */
.tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px; }
.tag-chip {
  font-size: 12px; padding: 2px 10px; border-radius: 999px;
  background: var(--sidebar-accent); color: var(--muted-fg);
  cursor: pointer; transition: all 0.12s;
}
.tag-chip:hover { background: var(--accent); color: var(--accent-fg); }

/* Main area */
.main-area { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
  min-height: 56px;
}
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--input);
  border-radius: var(--radius); padding: 0 12px;
  height: 36px; width: 280px; transition: border-color 0.15s;
}
.search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px hsl(var(--theme-hue) var(--theme-sat) 55% / 0.15); }
.search-box .ico { color: var(--muted-fg); width: 16px; height: 16px; }
.search-box input { border: none; background: none; outline: none; flex: 1; color: var(--fg); }
.search-box input::placeholder { color: var(--muted-fg); }
.topbar-spacer { flex: 1; }

/* View toggle group */
.view-toggle {
  display: flex; background: var(--card); border: 1px solid var(--input);
  border-radius: var(--radius); overflow: hidden; height: 36px;
}
.view-toggle button {
  display: flex; align-items: center; justify-content: center;
  width: 36px; color: var(--muted-fg); transition: all 0.12s;
}
.view-toggle button:hover { background: var(--sidebar-accent); color: var(--fg); }
.view-toggle button.active { background: var(--primary); color: var(--primary-fg); }

/* Select */
.select-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--card); border: 1px solid var(--input);
  border-radius: var(--radius); padding: 0 10px; height: 36px;
  font-size: 13px; color: var(--fg); transition: border-color 0.15s;
}
.select-pill:hover { border-color: var(--muted-fg); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 36px; border-radius: var(--radius);
  font-size: 13px; font-weight: 500; transition: all 0.12s;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-primary:hover { filter: brightness(1.1); box-shadow: 0 2px 8px hsl(var(--theme-hue) var(--theme-sat) 55% / 0.3); }
.btn-ghost { background: var(--card); border: 1px solid var(--input); color: var(--fg); }
.btn-ghost:hover { background: var(--sidebar-accent); }
.btn-ghost .ico { color: var(--muted-fg); }
.btn-sm { height: 30px; font-size: 12px; padding: 0 10px; }
.btn-icon {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: var(--radius);
  color: var(--muted-fg); transition: all 0.12s;
}
.btn-icon:hover { background: var(--sidebar-accent); color: var(--fg); }

/* Content scroll area */
.content-scroll { flex: 1; overflow-y: auto; padding: 20px; }

/* ═══════════════════════════════════════════════════════════════
   PROMPT CARDS — Card View
   ═══════════════════════════════════════════════════════════════ */
.prompt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.prompt-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  cursor: pointer; transition: all 0.15s;
  display: flex; flex-direction: column; gap: 10px;
}
.prompt-card:hover { border-color: var(--primary); box-shadow: var(--shadow); transform: translateY(-1px); }
.prompt-card-header { display: flex; align-items: flex-start; gap: 10px; }
.prompt-type-badge {
  width: 36px; height: 36px; border-radius: calc(var(--radius) - 4px);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 18px;
}
.prompt-type-badge.text { background: hsl(210 60% 50% / 0.12); color: hsl(210 60% 55%); }
.prompt-type-badge.image { background: hsl(280 50% 55% / 0.12); color: hsl(280 50% 60%); }
.prompt-card-title { font-weight: 600; font-size: 14px; line-height: 1.4; flex: 1; }
.prompt-card-desc { font-size: 12px; color: var(--muted-fg); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prompt-card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.prompt-tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); }
.prompt-card-footer { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--muted-fg); padding-top: 8px; border-top: 1px solid var(--border); margin-top: auto; }
.prompt-card-footer span { display: flex; align-items: center; gap: 3px; }
.prompt-card-footer .star { color: hsl(45 90% 55%); }

/* List view */
.prompt-list { display: flex; flex-direction: column; gap: 2px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.prompt-list-header { display: grid; grid-template-columns: 1fr 80px 100px 80px 80px 40px; gap: 12px; padding: 10px 16px; font-size: 11px; font-weight: 600; color: var(--muted-fg); text-transform: uppercase; border-bottom: 1px solid var(--border); background: var(--muted); }
.prompt-list-row { display: grid; grid-template-columns: 1fr 80px 100px 80px 80px 40px; gap: 12px; padding: 12px 16px; font-size: 13px; align-items: center; cursor: pointer; transition: background 0.1s; border-bottom: 1px solid var(--border); }
.prompt-list-row:last-child { border-bottom: none; }
.prompt-list-row:hover { background: var(--sidebar-accent); }
.prompt-list-row .pl-title { font-weight: 500; display: flex; align-items: center; gap: 8px; }

/* Gallery view */
.prompt-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.gallery-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: all 0.15s; }
.gallery-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.gallery-thumb { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.gallery-thumb.text-grad { background: linear-gradient(135deg, hsl(210 60% 50% / 0.15), hsl(210 60% 65% / 0.05)); }
.gallery-thumb.image-grad { background: linear-gradient(135deg, hsl(280 50% 55% / 0.15), hsl(320 50% 60% / 0.05)); }
.gallery-body { padding: 12px; }
.gallery-body h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.gallery-body p { font-size: 11px; color: var(--muted-fg); }

/* ═══════════════════════════════════════════════════════════════
   SKILL CARDS
   ═══════════════════════════════════════════════════════════════ */
.skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.skill-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  transition: all 0.15s;
}
.skill-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.skill-card-header { display: flex; gap: 12px; align-items: flex-start; }
.skill-icon-box {
  width: 44px; height: 44px; border-radius: calc(var(--radius) - 2px);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.skill-name { font-weight: 600; font-size: 14px; }
.skill-author { font-size: 11px; color: var(--muted-fg); }
.skill-desc { font-size: 12px; color: var(--muted-fg); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.skill-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.skill-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--border); margin-top: auto; }
.skill-meta { font-size: 11px; color: var(--muted-fg); display: flex; gap: 10px; }
.skill-meta span { display: flex; align-items: center; gap: 3px; }

/* ═══════════════════════════════════════════════════════════════
   AGENT CARDS / WORKSPACE
   ═══════════════════════════════════════════════════════════════ */
.agent-layout { display: flex; gap: 20px; height: 100%; }
.agent-sidebar { width: 280px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.agent-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; cursor: pointer; transition: all 0.12s;
  display: flex; gap: 10px; align-items: center;
}
.agent-card:hover { border-color: var(--muted-fg); }
.agent-card.active { border-color: var(--primary); background: var(--accent); }
.agent-avatar { width: 40px; height: 40px; border-radius: calc(var(--radius) - 4px); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.agent-info { flex: 1; min-width: 0; }
.agent-name { font-size: 13px; font-weight: 600; }
.agent-status { font-size: 11px; display: flex; align-items: center; gap: 4px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; }
.status-dot.ok { background: #28c840; }
.status-dot.warn { background: #febc2e; }
.status-dot.err { background: #ff5f57; }
.status-dot.muted { background: var(--muted-fg); }
.agent-workspace { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
.ws-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.ws-tabs { display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.ws-tab { padding: 10px 14px; font-size: 13px; color: var(--muted-fg); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.12s; white-space: nowrap; }
.ws-tab:hover { color: var(--fg); }
.ws-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.ws-body { flex: 1; overflow-y: auto; padding: 20px; }

/* Stat cards */
.stat-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.stat-label { font-size: 11px; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.04em; }
.stat-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.stat-sub { font-size: 11px; color: var(--muted-fg); margin-top: 2px; }

/* Info grid */
.info-grid { display: grid; grid-template-columns: 160px 1fr; gap: 0; }
.info-grid dt { font-size: 13px; color: var(--muted-fg); padding: 8px 0; }
.info-grid dd { font-size: 13px; padding: 8px 0; font-weight: 500; }

/* Session list */
.session-item { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; transition: all 0.12s; background: var(--bg); }
.session-item:hover { border-color: var(--primary); }
.session-title { font-size: 13px; font-weight: 500; flex: 1; }
.session-meta { font-size: 11px; color: var(--muted-fg); }

/* Usage ring */
.usage-ring-wrap { display: flex; gap: 24px; }
.usage-ring { text-align: center; }
.usage-ring svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--primary); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.3s; }
.ring-label { font-size: 11px; color: var(--muted-fg); margin-top: 6px; }

/* ═══════════════════════════════════════════════════════════════
   MCP / PLUGIN cards
   ═══════════════════════════════════════════════════════════════ */
.mcp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.mcp-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: all 0.15s; }
.mcp-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.mcp-card-header { display: flex; gap: 10px; align-items: flex-start; }
.mcp-icon-box { width: 40px; height: 40px; border-radius: calc(var(--radius) - 4px); background: var(--accent); display: flex; align-items: center; justify-content: center; color: var(--accent-fg); flex-shrink: 0; }
.mcp-config { font-family: var(--mono); font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: calc(var(--radius) - 4px); padding: 8px 10px; color: var(--muted-fg); overflow-x: auto; white-space: nowrap; }

/* ═══════════════════════════════════════════════════════════════
   RULES workspace
   ═══════════════════════════════════════════════════════════════ */
.rules-layout { display: flex; flex-direction: column; height: 100%; gap: 12px; }
.rules-file-list { display: flex; flex-direction: column; gap: 4px; }
.rule-file-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: calc(var(--radius) - 2px); cursor: pointer; font-size: 13px; transition: background 0.12s; }
.rule-file-item:hover { background: var(--sidebar-accent); }
.rule-file-item.active { background: var(--accent); color: var(--accent-fg); }
.rule-editor-wrap { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
.rule-editor-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 8px; }
.rule-editor-body { flex: 1; overflow: hidden; display: flex; }
.rule-textarea { flex: 1; border: none; outline: none; resize: none; padding: 16px; font-family: var(--mono); font-size: 13px; line-height: 1.6; background: var(--card); color: var(--fg); }
.rule-preview { flex: 1; padding: 16px; overflow-y: auto; border-left: 1px solid var(--border); font-size: 13px; line-height: 1.7; }
.rule-preview h1 { font-size: 20px; font-weight: 700; margin: 16px 0 8px; }
.rule-preview h2 { font-size: 16px; font-weight: 600; margin: 14px 0 6px; }
.rule-preview h3 { font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
.rule-preview p { margin: 6px 0; color: var(--muted-fg); }
.rule-preview code { font-family: var(--mono); font-size: 12px; background: var(--muted); padding: 1px 5px; border-radius: 3px; }
.rule-preview ul, .rule-preview ol { padding-left: 20px; margin: 6px 0; color: var(--muted-fg); }
.rule-preview li { margin: 3px 0; }

/* ═══════════════════════════════════════════════════════════════
   SETTINGS
   ═══════════════════════════════════════════════════════════════ */
.settings-layout { display: flex; gap: 0; height: 100%; background: var(--bg); }
.settings-nav { width: 220px; border-right: 1px solid var(--border); padding: 12px 8px; overflow-y: auto; flex-shrink: 0; }
.settings-content { flex: 1; overflow-y: auto; padding: 28px; max-width: 720px; }
.settings-content h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.settings-content .settings-desc { color: var(--muted-fg); font-size: 13px; margin-bottom: 24px; }
.settings-section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 0; margin-bottom: 16px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); gap: 16px; }
.settings-row:last-child { border-bottom: none; }
.settings-row-info { flex: 1; }
.settings-row-label { font-size: 13px; font-weight: 500; }
.settings-row-desc { font-size: 12px; color: var(--muted-fg); margin-top: 2px; }
.settings-control { flex-shrink: 0; }

/* Toggle switch */
.toggle { width: 40px; height: 22px; border-radius: 999px; background: var(--input); position: relative; cursor: pointer; transition: background 0.2s; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: white; transition: transform 0.2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle.on { background: var(--primary); }
.toggle.on::after { transform: translateX(18px); }

/* Theme swatches */
.theme-swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.theme-swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
.theme-swatch.active { border-color: var(--fg); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--fg); }

/* Text input */
.text-input { background: var(--bg); border: 1px solid var(--input); border-radius: calc(var(--radius) - 2px); padding: 0 12px; height: 36px; color: var(--fg); outline: none; transition: border-color 0.15s; min-width: 180px; }
.text-input:focus { border-color: var(--primary); }
.select-input { background: var(--bg); border: 1px solid var(--input); border-radius: calc(var(--radius) - 2px); padding: 0 12px; height: 36px; color: var(--fg); outline: none; }

/* API key rows */
.provider-row { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.provider-row:last-child { border-bottom: none; }
.provider-logo { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.provider-info { flex: 1; }
.provider-name { font-size: 13px; font-weight: 500; }
.provider-models { font-size: 11px; color: var(--muted-fg); }

/* ═══════════════════════════════════════════════════════════════
   MODALS
   ═══════════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: var(--popover); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column;
  transform: scale(0.95); transition: transform 0.2s;
}
.modal-overlay.show .modal { transform: scale(1); }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }

/* Platform install grid */
.platform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-height: 400px; overflow-y: auto; padding: 4px; }
.platform-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: calc(var(--radius) - 4px); cursor: pointer; transition: all 0.12s; font-size: 12px; }
.platform-item:hover { border-color: var(--primary); background: var(--accent); }
.platform-item.selected { border-color: var(--primary); background: var(--accent); }
.platform-item .check { width: 16px; height: 16px; color: var(--primary); opacity: 0; }
.platform-item.selected .check { opacity: 1; }

/* Prompt detail modal */
.prompt-detail-body { width: 700px; max-width: 90vw; }
.detail-field { margin-bottom: 16px; }
.detail-label { font-size: 12px; font-weight: 600; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.detail-textarea { width: 100%; min-height: 80px; background: var(--bg); border: 1px solid var(--input); border-radius: calc(var(--radius) - 2px); padding: 10px 12px; font-family: var(--mono); font-size: 13px; color: var(--fg); outline: none; resize: vertical; }
.detail-textarea:focus { border-color: var(--primary); }

/* Variable pills */
.var-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.var-pill { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 4px; background: hsl(45 80% 50% / 0.12); color: hsl(40 70% 50%); border: 1px solid hsl(45 80% 50% / 0.2); }

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--muted-fg); }
.empty-state .ico-xl { opacity: 0.4; }

/* Toast */
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 8px; z-index: 2000; transform: translateY(80px); opacity: 0; transition: all 0.3s; max-width: 360px; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast .ico { color: #28c840; }

/* Utility */
.hidden { display: none !important; }
.flex { display: flex; }
.items-center { align-items: center; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.mt-2 { margin-top: 8px; }
.mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; }
.mb-4 { margin-bottom: 16px; }
.text-muted { color: var(--muted-fg); }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.font-mono { font-family: var(--mono); }
.fw-600 { font-weight: 600; }
.fw-700 { font-weight: 700; }
.flex-1 { flex: 1; }
.flex-wrap { flex-wrap: wrap; }
.w-full { width: 100%; }
.rounded { border-radius: var(--radius); }
.section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.content-padded { padding: 24px; }
</style>
</head>

// RENDER: Icon Rail
// ═══════════════════════════════════════════════════════════════
function renderIconRail() {
  const rail = document.getElementById('iconRail');
  rail.innerHTML = MODULES.map(m => `
    <button class="rail-btn ${m.id === currentModule ? 'active' : ''}" onclick="switchModule('${m.id}')" title="${m.label}">
      ${ICONS[m.icon]}
    </button>
  `).join('') + `
    <div class="rail-sep"></div>
    <button class="rail-btn ${currentModule === 'settings' ? 'active' : ''}" onclick="switchModule('settings')" title="设置">
      ${ICONS.settings}
    </button>
  `;
}

// ═══════════════════════════════════════════════════════════════
// RENDER: Nav Panel
// ═══════════════════════════════════════════════════════════════
function renderNavPanel() {
  const panel = document.getElementById('navPanel');
  if (currentModule === 'settings') {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = '';
  const nav = getNavPanel(currentModule);
  let html = `
    <div class="nav-panel-header">
      <div class="nav-panel-title">${nav.title}</div>
      <div class="nav-panel-sub">${nav.sub}</div>
    </div>
    <div class="nav-list">
  `;
  for (const sec of nav.sections) {
    if (sec.type === 'items') {
      html += sec.items.map(it => `
        <button class="nav-item ${it.active ? 'active' : ''}" ${it.filter ? `onclick="filterPrompts('${it.filter}')"` : `onclick="showToast('已切换到 ${it.label}')"`}>
          ${ICONS[it.icon] || ICONS.allPrompts}
          <span>${it.label}</span>
          ${it.count !== undefined ? `<span class="nav-item-count">${it.count}</span>` : ''}
        </button>
      `).join('');
    } else if (sec.type === 'section') {
      html += `<div class="nav-section">${sec.label}</div>`;
    } else if (sec.type === 'folders') {
      html += '<div class="folder-tree">';
      FOLDERS.forEach((f, i) => {
        html += `
          <div class="folder-row ${i < 2 ? 'expanded' : ''}" onclick="toggleFolder(this)">
            ${ICONS.chevron}
            <span>${f.private ? ICONS.folderLock : ICONS.folder}</span>
            <span style="flex:1">${f.private ? '🔒 ' : ''}${f.name}</span>
            <span class="nav-item-count">${f.count}</span>
          </div>
        `;
      });
      html += '</div>';
    } else if (sec.type === 'tags') {
      html += '<div class="tag-cloud">';
      TAGS.slice(0, 14).forEach(t => {
        html += `<span class="tag-chip" onclick="showToast('筛选标签: ${t}')">${t}</span>`;
      });
      html += '</div>';
    }
  }
  html += '</div>';
  panel.innerHTML = html;
}

let promptFilter = 'all';
let promptSearch = '';

function renderContent() {
  const el = document.getElementById('contentScroll');
  if (currentModule === 'settings') { renderSettings(); return; }

  if (currentModule === 'prompt') {
    let list = PROMPTS;
    if (promptFilter === 'text') list = list.filter(p => p.type === 'text');
    if (promptFilter === 'image') list = list.filter(p => p.type === 'image');
    if (promptFilter === 'fav') list = list.filter(p => p.fav);
    if (promptSearch) {
      const q = promptSearch.toLowerCase();
      list = list.filter(p => p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.tags.some(t => t.toLowerCase().includes(q)));
    }
    el.innerHTML = renderPromptView(list);
  } else if (currentModule === 'skill') {
    el.innerHTML = renderSkillView();
  } else if (currentModule === 'agents') {
    el.innerHTML = renderAgentsView();
  } else if (currentModule === 'mcp') {
    el.innerHTML = renderMCPView();
  } else if (currentModule === 'plugin') {
    el.innerHTML = renderPluginView();
  } else if (currentModule === 'rules') {
    el.innerHTML = renderRulesView();
  }
}

function renderPromptView(list) {
  if (list.length === 0) {
    return `<div class="empty-state">
      ${ICONS.prompt.replace('class="ico"','class="ico-xl"')}
      <div>没有找到匹配的 Prompt</div>
    </div>`;
  }
  if (promptView === 'card') {
    return `<div class="prompt-grid">` + list.map(p => `
      <div class="prompt-card" onclick="openPromptDetail(${p.id})">
        <div class="prompt-card-header">
          <div class="prompt-type-badge ${p.type}">${p.type === 'text' ? '📝' : '🎨'}</div>
          <div style="flex:1;min-width:0">
            <div class="prompt-card-title">${p.fav ? '<span style="color:hsl(45 90% 55%)">★</span> ' : ''}${p.title}</div>
            <div class="prompt-card-desc">${p.desc}</div>
          </div>
        </div>
        <div class="prompt-card-tags">
          ${p.tags.map(t => `<span class="prompt-tag">${t}</span>`).join('')}
        </div>
        <div class="prompt-card-footer">
          <span>${ICONS.folder.replace('class="ico-sm folder-icon"','class="ico-sm" style="width:13px;height:13px;color:hsl(45 80% 55%)"')} ${p.folder}</span>
          <span>${ICONS.zap.replace('class="ico-sm"','class="ico-sm" style="width:13px;height:13px"')} ${p.uses}</span>
          ${p.vars.length ? `<span style="font-family:var(--mono);font-size:11px;color:hsl(40 70% 50%)">{{${p.vars.length}}}</span>` : ''}
        </div>
      </div>
    `).join('') + `</div>`;
  }
  if (promptView === 'list') {
    return `<div class="prompt-list">
      <div class="prompt-list-header">
        <span>标题</span><span>类型</span><span>文件夹</span><span>使用</span><span>收藏</span><span></span>
      </div>
      ${list.map(p => `
        <div class="prompt-list-row" onclick="openPromptDetail(${p.id})">
          <span class="pl-title">${p.type === 'text' ? '📝' : '🎨'} ${p.title}</span>
          <span class="text-muted text-sm">${p.type === 'text' ? '文本' : '绘图'}</span>
          <span class="text-muted text-sm">${p.folder}</span>
          <span class="text-muted text-sm">${p.uses}</span>
          <span>${p.fav ? '⭐' : '—'}</span>
          <span class="text-muted">${ICONS.edit}</span>
        </div>
      `).join('')}
    </div>`;
  }
  // gallery
  return `<div class="prompt-gallery">` + list.map(p => `
    <div class="gallery-card" onclick="openPromptDetail(${p.id})">
      <div class="gallery-thumb ${p.type === 'text' ? 'text-grad' : 'image-grad'}">${p.type === 'text' ? '📝' : '🎨'}</div>
      <div class="gallery-body">
        <h4>${p.title}</h4>
        <p>${p.tags.join(' · ')}</p>
      </div>
    </div>
  `).join('') + `</div>`;
}

              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:500">${r.name}</div>
                <div class="text-xs text-muted">${r.group}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="rule-editor-wrap">
          <div class="ws-header" style="padding:12px 16px">
            <div style="flex:1">
              <div class="fw-600">${rule.name}</div>
              <div class="text-xs text-muted">${rule.path} · ${rule.size} · 修改于 ${rule.modified}</div>
            </div>
            <button class="btn-icon" onclick="showToast('版本历史')" title="历史">${ICONS.history}</button>
            <button class="btn-icon" onclick="showToast('AI 改写')" title="AI改写">${ICONS.zap}</button>
          </div>
          <div class="rule-editor-tabs">
            <div class="ws-tab ${ruleEditorMode==='edit'?'active':''}" onclick="setRuleMode('edit')" style="padding:8px 14px">${ICONS.edit} 编辑</div>
            <div class="ws-tab ${ruleEditorMode==='preview'?'active':''}" onclick="setRuleMode('preview')" style="padding:8px 14px">${ICONS.eye} 预览</div>
          </div>
          <div class="rule-editor-body">
            ${ruleEditorMode === 'edit'
              ? `<textarea class="rule-textarea" onchange="showToast('草稿已保存')">${RULE_CONTENT}</textarea>`
              : `<div class="rule-preview">${renderMarkdown(RULE_CONTENT)}</div>`
            }
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderMarkdown(md) {
  return md
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^- (.*)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^(?!<[hul])(.+)$/gm, '<p>$1</p>')
    .replace(/<p><\/p>/g, '');
}

        <div style="display:flex;gap:8px">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="mode" checked> 符号链接 (Symlink)</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="mode"> 复制 (Copy)</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="closeModal();showToast('安装成功!')">${ICONS.check} 确认安装</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function openQuickAdd() {
  const modal = document.getElementById('modalContent');
  modal.className = 'modal';
  modal.style.width = '520px';
  modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">新建 Prompt</div>
      <button class="btn-icon" onclick="closeModal()">${ICONS.close}</button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        ${[
          { emoji:'✏️', label:'手动添加', desc:'填写详细信息' },
          { emoji:'🔍', label:'智能分析', desc:'粘贴内容,AI 自动提取' },
          { emoji:'✨', label:'AI 生成', desc:'描述需求,AI 自动编写' },
          { emoji:'🖼️', label:'图片反推', desc:'上传图片反推 Prompt' },
        ].map((m,i) => `
          <div style="border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .15s;text-align:center" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'" onclick="closeModal();showToast('${m.label}模式')">
            <div style="font-size:28px;margin-bottom:8px">${m.emoji}</div>
            <div class="fw-600" style="font-size:14px">${m.label}</div>
            <div class="text-muted text-sm mt-2">${m.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}
function closeModalOnOverlay(e) { closeModal(); }

// ═══════════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════════
function switchModule(id) {
  currentModule = id;
  renderIconRail();
  renderNavPanel();
  renderTopbar();
  renderContent();
}

function setPromptView(v) { promptView = v; renderTopbar(); renderContent(); }

function filterPrompts(f) {
  promptFilter = f;
  document.querySelectorAll('#navPanel .nav-item').forEach(el => el.classList.remove('active'));
  event?.target?.closest('.nav-item')?.classList.add('active');
  renderContent();
}

function filterPromptSearch(v) { promptSearch = v; renderContent(); }

function toggleFolder(el) { el.classList.toggle('expanded'); }

function selectAgent(i) { currentAgent = i; agentTab = 'overview'; renderContent(); }
function setAgentTab(t) { agentTab = t; renderContent(); }

function selectRule(i) { currentRule = i; renderContent(); }
function setRuleMode(m) { ruleEditorMode = m; renderContent(); }

function setSettingsSection(id) { settingsSection = id; renderContent(); }

function toggleSetting(key, el) {
  settingsState[key] = !settingsState[key];
  el.classList.toggle('on');
}

// Theme
function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.classList.toggle('dark', currentTheme === 'dark');
  document.getElementById('themeIcon').outerHTML = currentTheme === 'dark'
    ? '<svg class="ico" viewBox="0 0 24 24" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg class="ico" viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  showToast(currentTheme === 'dark' ? '已切换到深色模式' : '已切换到浅色模式');
}

function setThemeMode(mode) {
  if (mode === 'system') mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  currentTheme = mode;
  document.documentElement.classList.toggle('dark', mode === 'dark');
  document.getElementById('themeIcon').outerHTML = mode === 'dark'
    ? '<svg class="ico" viewBox="0 0 24 24" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg class="ico" viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
}

function setThemeColor(id, hue, sat) {
  currentThemeColor = id;
  document.documentElement.style.setProperty('--theme-hue', hue);
  document.documentElement.style.setProperty('--theme-sat', sat);
  document.querySelectorAll('.theme-swatch').forEach(el => el.classList.remove('active'));
  event?.target?.classList.add('active');
  showToast(`主题已切换为 ${id}`);
}

// Toast
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.querySelector('.search-box input')?.focus(); }
  if (e.key === 'Escape') closeModal();
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
renderIconRail();
renderNavPanel();
renderTopbar();
renderContent();
</script>
</body>
</html>
